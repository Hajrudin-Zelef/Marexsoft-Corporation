<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeu de dames</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#e6edf3;
    --dim:#8b949e; --accent:#58a6ff; --gold:#f2c14e;
    --light:#e6d3b3; --dark:#7d4f2e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(circle at 50% -10%,#1c2530 0%,#0d1117 60%),
      var(--bg);
    color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:16px; user-select:none; touch-action:manipulation;
    animation:pageIn .5s ease both;
  }
  @keyframes pageIn{from{opacity:0}to{opacity:1}}
  #app{width:100%; max-width:520px; display:flex; flex-direction:column; gap:14px}

  /* ---------- Titre ---------- */
  header h1{
    margin:0; font-size:18px; letter-spacing:.16em; text-transform:uppercase;
    background:linear-gradient(100deg,var(--txt) 30%,var(--gold) 50%,var(--txt) 70%);
    background-size:220% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 5s linear infinite;
  }
  @keyframes shimmer{to{background-position:-220% 0}}
  header p{margin:4px 0 0; font-size:12px; color:var(--dim); animation:rise .5s .1s ease both}
  @keyframes rise{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  /* ---------- Cadre bois + damier ---------- */
  .frame{
    padding:10px; border-radius:16px;
    background:linear-gradient(135deg,#5a3a22 0%,#7d4f2e 30%,#4a2f1b 60%,#6b4426 100%);
    box-shadow:0 14px 44px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15);
    animation:rise .5s .15s ease both;
  }
  #board{
    position:relative;
    display:grid; grid-template-columns:repeat(8,1fr); aspect-ratio:1/1;
    width:100%; border-radius:8px; overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), inset 0 4px 18px rgba(0,0,0,.35);
    touch-action:manipulation;
  }
  .cell{position:relative; display:flex; align-items:center; justify-content:center}
  .cell.light{background:var(--light)}
  .cell.dark{background:var(--dark)}
  .cell.dark::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 6px,transparent 6px 12px);
  }
  .cell.deal{animation:deal .45s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes deal{from{opacity:0; transform:scale(.6)}to{opacity:1; transform:scale(1)}}
  .cell.last{box-shadow:inset 0 0 0 3px rgba(88,166,255,.55)}
  .cell.sel{animation:selPulse 1.1s ease-in-out infinite}
  @keyframes selPulse{
    0%,100%{box-shadow:inset 0 0 0 4px var(--gold)}
    50%{box-shadow:inset 0 0 0 5px var(--gold), inset 0 0 18px rgba(242,193,78,.55)}
  }
  .cell.pending{box-shadow:inset 0 0 0 4px #d29922}
  .cell.hint::after{
    content:''; position:absolute; width:28%; height:28%; border-radius:50%;
    background:rgba(242,193,78,.9); box-shadow:0 0 10px rgba(242,193,78,.7);
    pointer-events:none;
    animation:hintRipple 1.2s ease-out infinite;
    animation-delay:var(--hint-delay,0ms);
  }
  @keyframes hintRipple{
    0%{transform:scale(.55); opacity:1}
    70%{transform:scale(1.15); opacity:.85}
    100%{transform:scale(.55); opacity:1}
  }
  .cell.trail::before{
    content:''; position:absolute; width:16%; height:16%; border-radius:50%;
    background:rgba(88,166,255,.75); pointer-events:none;
    animation:trailFade 1.4s ease forwards;
  }
  @keyframes trailFade{from{opacity:.9; transform:scale(1)}to{opacity:0; transform:scale(.4)}}

  /* ---------- Pions ---------- */
  .piece{
    position:relative; z-index:1;
    width:78%; height:78%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(11px,3.2vw,20px); line-height:1;
    box-shadow:inset 0 -4px 8px rgba(0,0,0,.45), inset 0 3px 5px rgba(255,255,255,.25), 0 4px 8px rgba(0,0,0,.45);
    transition:transform .15s ease;
  }
  .cell.playable{cursor:pointer}
  .cell.playable .piece:hover{transform:translateY(-3px) scale(1.04)}
  .cell.hint .piece{transform:scale(.94)}
  .piece.w{background:radial-gradient(circle at 34% 28%,#ffffff,#cfc7b8); border:2px solid #a3988a; color:#7d4f2e}
  .piece.b{background:radial-gradient(circle at 34% 28%,#555,#121212); border:2px solid #000; color:var(--gold)}
  .piece.king span{font-size:1em; filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
  .piece.king{box-shadow:inset 0 -4px 8px rgba(0,0,0,.45), inset 0 3px 5px rgba(255,255,255,.25), 0 4px 8px rgba(0,0,0,.45), 0 0 12px rgba(242,193,78,.55)}
  .piece.landed{animation:land .32s cubic-bezier(.2,.9,.3,1.35)}
  @keyframes land{0%{transform:scale(.3)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  .ghost{
    position:absolute; z-index:0; width:78%; height:78%; border-radius:50%;
    pointer-events:none;
    animation:ghostOut .65s ease forwards;
  }
  .ghost.w{background:radial-gradient(circle at 34% 28%,#ffffff,#cfc7b8); border:2px solid #a3988a}
  .ghost.b{background:radial-gradient(circle at 34% 28%,#555,#121212); border:2px solid #000}
  @keyframes ghostOut{
    0%{opacity:1; transform:scale(1)}
    100%{opacity:0; transform:scale(.2) translateY(10px)}
  }

  /* ---------- Pion volant + étincelles ---------- */
  .flyer{
    position:absolute; z-index:5; width:9.75%; height:9.75%; margin:0;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 10px 10px rgba(0,0,0,.55));
    pointer-events:none;
  }
  .spark{
    position:absolute; z-index:6; width:7px; height:7px; border-radius:50%;
    background:var(--gold); pointer-events:none;
    animation:burst .7s ease-out forwards;
  }
  @keyframes burst{
    from{opacity:1; transform:translate(0,0) scale(1)}
    to{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.2)}
  }

  /* ---------- HUD ---------- */
  .hud{display:flex; flex-direction:column; gap:10px; animation:rise .5s .25s ease both}
  .status{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:13px; min-height:42px; display:flex;
    align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 4px 14px rgba(0,0,0,.3);
  }
  .status b{color:var(--accent)}
  .status.win{color:var(--gold); border-color:var(--gold)}
  .msg-in{display:inline-block; animation:msgIn .3s ease}
  @keyframes msgIn{from{opacity:0; transform:translateY(5px)}to{opacity:1; transform:none}}
  .turn{display:inline-flex; align-items:center; gap:7px}
  .turn-dot{width:9px; height:9px; border-radius:50%; background:#3fb950; box-shadow:0 0 8px #3fb950; animation:dotPulse 1.6s ease-in-out infinite}
  .turn-dot.ai{background:#d29922; box-shadow:0 0 8px #d29922}
  @keyframes dotPulse{0%,100%{transform:scale(1); opacity:1}50%{transform:scale(.7); opacity:.6}}
  .dots span{animation:blink 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  .counts{font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--dim); white-space:nowrap}
  .controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  button,select{
    font:inherit; font-size:12px; padding:8px 12px; color:var(--txt);
    background:linear-gradient(#2a3138,#21262d); border:1px solid var(--border); border-radius:8px;
    cursor:pointer; transition:transform .1s, background .15s, box-shadow .15s;
  }
  button:hover,select:hover{background:#30363d; box-shadow:0 2px 8px rgba(0,0,0,.35)}
  button:active{transform:scale(.96)}
  button:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button:disabled{opacity:.45; cursor:default; transform:none}
  .grow{flex:1}
  #reset{background:linear-gradient(#2ea043,#238636); border-color:#2ea043; font-weight:600}
  #reset:hover{background:linear-gradient(#3fb950,#2ea043)}
  select{max-width:110px}

  /* ---------- Overlay de fin ---------- */
  #overlay{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(5,8,12,.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  #overlay.show{display:flex; animation:fadeIn .4s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #overlay .card{
    background:linear-gradient(#1c2530,#141a21);
    border:1px solid var(--gold); border-radius:18px; padding:28px 30px;
    text-align:center; max-width:340px; width:100%;
    box-shadow:0 24px 70px rgba(0,0,0,.7), 0 0 40px rgba(242,193,78,.15);
    animation:cardIn .5s cubic-bezier(.2,.9,.3,1.25);
  }
  @keyframes cardIn{from{opacity:0; transform:scale(.7) translateY(24px)}to{opacity:1; transform:none}}
  #overlay .trophy{font-size:52px; animation:trophyIn .7s .15s cubic-bezier(.2,.9,.3,1.4) both}
  @keyframes trophyIn{from{opacity:0; transform:scale(0) rotate(-20deg)}to{opacity:1; transform:scale(1) rotate(0)}}
  #overlay h2{margin:12px 0 6px; font-size:22px}
  #overlay p{margin:0 0 18px; color:var(--dim); font-size:13px}
  #overlay .row{display:flex; gap:8px}
  #overlay .row button{flex:1; padding:11px}
  .confetti{position:fixed; top:-14px; z-index:51; pointer-events:none; border-radius:2px; animation:fall linear forwards}
  @keyframes fall{
    to{transform:translateY(105vh) rotate(720deg); opacity:.9}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="../index.html#jeux" style="display:inline-block;font-size:12px;color:var(--dim);text-decoration:none;margin-bottom:6px">← Retour au site</a>
    <h1>Jeu de dames</h1>
    <p>8×8 · règles internationales : prise obligatoire, rafle majoritaire, dames volantes — vous jouez les blancs</p>
  </header>

  <div class="frame"><div id="board" aria-label="damier"></div></div>

  <div class="hud">
    <div class="status" id="status"><span class="turn"><span class="turn-dot" id="turnDot"></span><span id="msg">À vous de jouer.</span></span><span class="counts" id="counts"></span></div>
    <div class="controls">
      <select id="level" aria-label="niveau">
        <option value="2">Facile</option>
        <option value="4" selected>Moyen</option>
        <option value="6">Difficile</option>
      </select>
      <button id="sound" aria-label="son" title="Son on/off">🔊</button>
      <button id="undo">Annuler</button>
      <button id="reset" class="grow">Nouvelle partie</button>
    </div>
  </div>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-label="fin de partie">
  <div class="card">
    <div class="trophy" id="trophy">🏆</div>
    <h2 id="endTitle">Victoire !</h2>
    <p id="endSub"></p>
    <div class="row">
      <button id="again">Rejouer</button>
    </div>
  </div>
</div>

<script>
// ================== ENGINE START ==================
const EMPTY=0, WM=1, WK=2, BM=-1, BK=-2;
const sideOf = p => p>0 ? 1 : (p<0 ? -1 : 0);
const isKing = p => p===WK || p===BK;
const inside = (r,c) => r>=0 && r<8 && c>=0 && c<8;

function newBoard(){
  const b=new Array(64).fill(EMPTY);
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    if(((r+c)&1)!==1) continue;
    if(r<3) b[r*8+c]=BM;
    else if(r>4) b[r*8+c]=WM;
  }
  return b;
}

function dirsFor(p){
  const s=sideOf(p);
  if(isKing(p)) return [[-1,-1],[-1,1],[1,-1],[1,1]];
  const dr = s===1 ? -1 : 1;
  return [[dr,-1],[dr,1]];
}

// Règles internationales (FFJD, variante 8x8) :
// - prise OBLIGATOIRE ; un pion capture vers l'avant ET vers l'arrière ;
// - RAFLE MAJORITAIRE : seul le chemin qui prend le plus de pièces est légal ;
// - les pièces prises restent sur le damier jusqu'à la fin de la rafle
//   (elles bloquent l'atterrissage, on ne peut pas les resauter) ;
// - la dame est VOLANTE (déplacement et prise à distance).

// Captures d'un pion : les 4 diagonales adjacentes.
function manJumps(b,r,c,side,cap){
  const out=[];
  for(const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){
    const mr=r+dr, mc=c+dc, lr=r+2*dr, lc=c+2*dc;
    if(!inside(lr,lc)) continue;
    const mi=mr*8+mc, li=lr*8+lc, mid=b[mi];
    if(mid===EMPTY || sideOf(mid)!==-side || cap.has(mi)) continue;
    if(b[li]!==EMPTY) continue;
    out.push({mid:mi,lr,lc});
  }
  return out;
}

// Captures d'une dame volante : ennemie à distance, atterrissage libre derrière.
function kingJumps(b,r,c,side,cap){
  const out=[];
  for(const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){
    let mid=-1, dist=0;
    for(let k=1;;k++){
      const mr=r+dr*k, mc=c+dc*k;
      if(!inside(mr,mc)) break;
      const mi=mr*8+mc, v=b[mi];
      if(v===EMPTY) continue;
      if(sideOf(v)===side || cap.has(mi)) break;
      mid=mi; dist=k; break;
    }
    if(mid<0) continue;
    for(let t=1;;t++){
      const lr=r+dr*(dist+t), lc=c+dc*(dist+t);
      if(!inside(lr,lc)) break;
      if(b[lr*8+lc]!==EMPTY) break;
      out.push({mid,lr,lc});
    }
  }
  return out;
}

function collectJumps(b,r,c,p,side,king,cap,steps,res){
  const jumps = king ? kingJumps(b,r,c,side,cap) : manJumps(b,r,c,side,cap);
  for(const j of jumps){
    const ncap=new Set(cap); ncap.add(j.mid);
    const nb=b.slice();
    nb[r*8+c]=EMPTY;
    let endPiece=p, promoted=false;
    if(!king && ((side===1 && j.lr===0) || (side===-1 && j.lr===7))){
      promoted=true; endPiece = side===1?WK:BK;
    }
    nb[j.lr*8+j.lc]=endPiece;
    const nsteps=steps.concat([j.lr*8+j.lc]);
    if(promoted){ res.push({to:j.lr*8+j.lc,steps:nsteps,captured:[...ncap],promoted:true}); continue; }
    const sub=[];
    collectJumps(nb,j.lr,j.lc,endPiece,side,king,ncap,nsteps,sub);
    if(sub.length===0) res.push({to:j.lr*8+j.lc,steps:nsteps,captured:[...ncap],promoted:false});
    else for(const m of sub) res.push(m);
  }
}

function legalMoves(b,side){
  const caps=[];
  for(let i=0;i<64;i++){
    const p=b[i]; if(p===EMPTY || sideOf(p)!==side) continue;
    const res=[]; collectJumps(b,i>>3,i&7,p,side,isKing(p),new Set(),[],res);
    for(const m of res) caps.push({from:i,to:m.to,steps:m.steps,captured:m.captured,promoted:m.promoted});
  }
  if(caps.length){
    // Prise obligatoire + rafle majoritaire : seul le max est légal,
    // impossible d'aller ailleurs quand une prise existe.
    let mx=0; for(const m of caps) mx=Math.max(mx,m.captured.length);
    return caps.filter(m=>m.captured.length===mx);
  }
  const quiet=[];
  for(let i=0;i<64;i++){
    const p=b[i]; if(p===EMPTY || sideOf(p)!==side) continue;
    const r=i>>3, c=i&7;
    if(isKing(p)){
      for(const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){
        for(let k=1;;k++){
          const r1=r+dr*k, c1=c+dc*k;
          if(!inside(r1,c1) || b[r1*8+c1]!==EMPTY) break;
          quiet.push({from:i,to:r1*8+c1,steps:[r1*8+c1],captured:[],promoted:false});
        }
      }
    }else{
      for(const [dr,dc] of dirsFor(p)){
        const r1=r+dr, c1=c+dc;
        if(inside(r1,c1) && b[r1*8+c1]===EMPTY)
          quiet.push({from:i,to:r1*8+c1,steps:[r1*8+c1],captured:[],promoted:false});
      }
    }
  }
  return quiet;
}

function applyMove(b,m){
  const nb=b.slice();
  const p=nb[m.from], side=sideOf(p), king=isKing(p);
  nb[m.from]=EMPTY;
  for(const x of m.captured) nb[x]=EMPTY;
  let np=p;
  const lr=m.to>>3;
  if(!king && ((side===1 && lr===0) || (side===-1 && lr===7))) np = side===1?WK:BK;
  nb[m.to]=np;
  return nb;
}

// Score positif = bon pour les blancs.
function evaluate(b){
  let s=0;
  for(let i=0;i<64;i++){
    const p=b[i]; if(p===EMPTY) continue;
    const r=i>>3, c=i&7;
    const centre = (c>=2 && c<=5) ? 6 : 0;
    if(p===WM) s += 100 + (7-r)*4 + centre;
    else if(p===WK) s += 180 + centre;
    else if(p===BM) s -= 100 + r*4 + centre;
    else if(p===BK) s -= 180 + centre;
  }
  return s;
}

function search(b,side,depth,alpha,beta){
  const moves=legalMoves(b,side);
  if(moves.length===0) return -100000 - depth; // perdu, et plus vite c'est pire
  if(depth===0) return side*evaluate(b);
  let best=-Infinity;
  for(const m of moves){
    const nb=applyMove(b,m);
    const sc=-search(nb,-side,depth-1,-beta,-alpha);
    if(sc>best) best=sc;
    if(best>alpha) alpha=best;
    if(alpha>=beta) break;
  }
  return best;
}

// Budget temps par niveau (ms) : l'IA ne fait jamais freezer l'UI.
const TIME_BUDGET={2:250, 4:450, 6:650};

function bestMoveTimed(b,side,maxDepth,timeMs){
  const moves=legalMoves(b,side);
  if(!moves.length) return null;
  // Captures d'abord : élagage alpha-bêta bien plus rapide.
  moves.sort((m1,m2)=>m2.captured.length-m1.captured.length);
  const deadline=Date.now()+timeMs;
  let nodes=0;
  function searchT(bd,sd,depth,alpha,beta){
    if(((++nodes)&1023)===0 && Date.now()>deadline) throw 'TO';
    const ms=legalMoves(bd,sd);
    if(ms.length===0) return -100000 - depth;
    if(depth===0) return sd*evaluate(bd);
    ms.sort((a,c)=>c.captured.length-a.captured.length);
    let best=-Infinity;
    for(const m of ms){
      const sc=-searchT(applyMove(bd,m),-sd,depth-1,-beta,-alpha);
      if(sc>best) best=sc;
      if(best>alpha) alpha=best;
      if(alpha>=beta) break;
    }
    return best;
  }
  // Approfondissement itératif : le meilleur du dernier tour complet
  // est toujours utilisable si le temps s'épuise.
  let pool=moves;
  for(let d=1;d<=maxDepth;d++){
    try{
      let best=-Infinity, next=[];
      for(const m of pool){
        const sc=-searchT(applyMove(b,m),-side,d-1,-Infinity,Infinity);
        if(sc>best+1e-9){ best=sc; next=[m]; }
        else if(sc>best-1e-9) next.push(m);
      }
      pool=next;
      if(best>90000) break; // mat trouvé
    }catch(e){ break; }
    if(Date.now()>deadline) break;
  }
  return pool[(Math.random()*pool.length)|0];
}
// ================== ENGINE END ==================

// ================== UI ==================
const boardEl=document.getElementById('board');
const statusEl=document.getElementById('status');
const msgEl=document.getElementById('msg');
const turnDot=document.getElementById('turnDot');
const countsEl=document.getElementById('counts');
const levelEl=document.getElementById('level');
const undoEl=document.getElementById('undo');
const resetEl=document.getElementById('reset');
const soundEl=document.getElementById('sound');
const overlayEl=document.getElementById('overlay');
const trophyEl=document.getElementById('trophy');
const endTitleEl=document.getElementById('endTitle');
const endSubEl=document.getElementById('endSub');
const againEl=document.getElementById('again');

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const state={};
function reset(){
  state.board=newBoard();
  state.turn=1;              // 1 = humain (blancs), -1 = IA (noirs)
  state.history=[];
  state.selected=-1;
  state.pending=[];
  state.lastMove=null;
  state.over=false;
  state.draw=false;
  state.aiThinking=false;
  state.animating=false;
  state.noCapture=0;
  state.gen=(state.gen||0)+1;
  state.entrance=true;
  hideOverlay();
  refreshTurn();
  render();
  state.entrance=false;
}

// Coups du tour calculés UNE fois (pas à chaque case/clic : instantané).
function refreshTurn(){
  state.turnMoves=legalMoves(state.board,state.turn);
}

/* ---------- Son (WebAudio, aucun asset) ---------- */
let actx=null;
function tone(freq,delay,dur,type,vol){
  if(state.muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime+(delay||0);
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const sfx={
  select(){ tone(620,0,.07,'sine',.07); },
  step(){ tone(440,0,.09,'triangle',.1); },
  capture(){ tone(520,0,.09,'square',.06); tone(340,.07,.14,'square',.06); },
  promote(){ tone(660,0,.1,'sine',.1); tone(880,.09,.1,'sine',.1); tone(1174,.18,.2,'sine',.1); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.12,.22,'triangle',.11)); },
  lose(){ [392,330,262].forEach((f,i)=>tone(f,i*.14,.2,'triangle',.1)); },
};
soundEl.addEventListener('click',()=>{
  state.muted=!state.muted;
  soundEl.textContent=state.muted?'🔇':'🔊';
  soundEl.title=state.muted?'Son coupé':'Son activé';
});

function candidatesFor(from,pending){
  return (state.turnMoves||[])
    .filter(m => m.from===from && pending.every((sq,k)=>m.steps[k]===sq));
}

/* ---------- Animation de déplacement ---------- */
function cellCenter(i){
  const r=i>>3, c=i&7;
  return {x:(c+0.5)*12.5, y:(r+0.5)*12.5};
}
function pieceClass(p){
  return 'piece '+(p>0?'w':'b')+(isKing(p)?' king':'');
}
function flyAndCommit(m){
  const gen=state.gen;
  state.animating=true;
  render(); // fige l'état de départ
  const p=state.board[m.from];
  const pts=[m.from].concat(m.steps).map(cellCenter);
  if(reducedMotion){
    commitMove(m);
    return;
  }
  // Pion volant le long du chemin (sauts enchaînés).
  const fly=document.createElement('div');
  fly.className='flyer '+pieceClass(p).replace('piece ','');
  fly.style.left=pts[0].x+'%'; fly.style.top=pts[0].y+'%';
  if(isKing(p)) fly.innerHTML='<span>&#9819;</span>';
  boardEl.appendChild(fly);
  sfx.step();
  const keys=pts.map(q=>({left:q.x+'%',top:q.y+'%'}));
  const dur=Math.min(200+100*(pts.length-1),500);
  const anim=fly.animate(keys,{duration:dur,easing:'cubic-bezier(.3,.7,.3,1)',fill:'forwards'});
  anim.onfinish=()=>{
    fly.remove();
    if(gen!==state.gen) return;
    commitMove(m);
  };
}
function commitMove(m){
  const mover=state.board[m.from];
  const caps=m.captured.map(i=>({i,p:state.board[i]}));
  state.history.push({
    board:state.board.slice(), turn:state.turn,
    noCapture:state.noCapture, lastMove:state.lastMove
  });
  state.board=applyMove(state.board,m);
  state.noCapture = m.captured.length ? 0 : state.noCapture+1;
  state.lastMove={from:m.from,to:m.to,steps:m.steps,captured:m.captured.slice(),caps,promoted:m.promoted,mover};
  state.turn=-state.turn;
  state.selected=-1; state.pending=[];
  state.animating=false;
  refreshTurn();
  if(m.captured.length) sfx.capture();
  if(m.promoted){ sfx.promote(); burst(m.to); }
  render();
  checkEnd();
}
// instant=true : coup humain appliqué sur-le-champ (aucune attente).
// L'IA garde le bref vol pour que son coup reste lisible.
function playMove(m,instant){
  if(state.animating) return;
  if(instant){ commitMove(m); return; }
  flyAndCommit(m);
}

function burst(i){
  if(reducedMotion) return;
  const {x,y}=cellCenter(i);
  for(let k=0;k<14;k++){
    const s=document.createElement('div');
    s.className='spark';
    const a=(Math.PI*2*k)/14 + Math.random()*.4;
    const d=34+Math.random()*30;
    s.style.setProperty('--dx',(Math.cos(a)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d)+'px');
    s.style.left=x+'%'; s.style.top=y+'%';
    boardEl.appendChild(s);
    setTimeout(()=>s.remove(),750);
  }
}

function checkEnd(){
  if(!state.turnMoves.length){
    state.over=true;
    render();
    return;
  }
  if(state.noCapture>=60){
    state.over=true; state.draw=true;
    render();
    return;
  }
  if(state.turn===-1) aiTurn();
  else render();
}

function aiTurn(){
  if(state.over) return;
  state.aiThinking=true;
  render();
  setTimeout(()=>{
    const depth=parseInt(levelEl.value,10);
    let m=null;
    try{ m=bestMoveTimed(state.board,-1,depth,TIME_BUDGET[depth]||450); }catch(e){ console.error(e); }
    state.aiThinking=false;
    if(!m){ checkEnd(); return; }
    playMove(m);
  },reducedMotion?60:150);
}

function onCell(i){
  if(state.over || state.aiThinking || state.animating || state.turn!==1) return;
  if(i===state.selected){            // re-clic sur la piece selectionnee = deselection
    state.selected=-1; state.pending=[]; render(); return;
  }
  if(state.selected>=0){
    const cands=candidatesFor(state.selected,state.pending);
    const nextIdx=state.pending.length;
    const matched=cands.filter(m=>m.steps[nextIdx]===i);
    if(matched.length){
      const done=matched.filter(m=>m.steps.length===nextIdx+1);
      if(done.length){ playMove(done[0],true); return; }
      state.pending=state.pending.concat([i]);
      sfx.step();
      render();
      return;
    }
  }
  const p=state.board[i];
  if(p!==EMPTY && sideOf(p)===1 && (state.turnMoves||[]).some(m=>m.from===i)){
    state.selected=i; state.pending=[];
    sfx.select();
  }else{
    state.selected=-1; state.pending=[];
  }
  render();
}

function undo(){
  if(state.aiThinking || state.animating || !state.history.length) return;
  state.over=false; state.draw=false;
  hideOverlay();
  let guard=0;
  do{
    const h=state.history.pop();
    if(!h) break;
    state.board=h.board; state.turn=h.turn;
    state.noCapture=h.noCapture; state.lastMove=h.lastMove;
    guard++;
  }while(state.turn===-1 && state.history.length && guard<3);
  state.selected=-1; state.pending=[];
  refreshTurn();
  render();
}

/* ---------- Rendu ---------- */
function render(){
  // Liste du tour en cache (pas de recalcul par case/clic : instantané).
  const myMoves = (state.turn===1 && !state.over && !state.aiThinking) ? (state.turnMoves||[]) : [];
  const movable = new Set(myMoves.map(m=>m.from));
  const cands = state.selected>=0 ? candidatesFor(state.selected,state.pending) : [];
  const nextSteps = new Set(cands.map(m=>m.steps[state.pending.length]));
  const hintOrder={}; let hi=0;
  for(const m of cands){ const s=m.steps[state.pending.length]; if(!(s in hintOrder)) hintOrder[s]=(hi++)*90; }
  const trail=new Set();
  if(state.lastMove) for(const s of state.lastMove.steps.slice(0,-1)) trail.add(s);
  const ghosts = state.lastMove && state.lastMove.caps ? state.lastMove.caps : [];
  const ghostBy={}; for(const g of ghosts) ghostBy[g.i]=g.p;
  const frag=document.createDocumentFragment();
  for(let i=0;i<64;i++){
    const r=i>>3, c=i&7;
    const cell=document.createElement('div');
    cell.className='cell '+(((r+c)&1)===1 ? 'dark':'light');
    if(state.entrance) cell.classList.add('deal');
    if(state.selected===i || state.pending[state.pending.length-1]===i) cell.classList.add('sel');
    if(nextSteps.has(i)){ cell.classList.add('hint'); cell.style.setProperty('--hint-delay',(hintOrder[i]||0)+'ms'); }
    if(state.lastMove && (state.lastMove.from===i || state.lastMove.to===i)) cell.classList.add('last');
    if(trail.has(i)) cell.classList.add('trail');
    const p=state.board[i];
    if(p!==EMPTY){
      const pc=document.createElement('div');
      pc.className=pieceClass(p);
      if(isKing(p)) pc.innerHTML='<span>&#9819;</span>';
      if(state.lastMove && state.lastMove.to===i) pc.classList.add('landed');
      cell.appendChild(pc);
      if(movable.has(i)) cell.classList.add('playable');
    }else if(ghostBy[i]!==undefined){
      const g=document.createElement('div');
      g.className='ghost '+(ghostBy[i]>0?'w':'b');
      cell.appendChild(g);
    }
    cell.addEventListener('click',()=>onCell(i));
    frag.appendChild(cell);
  }
  // Distribution d'ouverture en cascade.
  let k=0;
  frag.querySelectorAll('.cell.deal').forEach((cell)=>{
    cell.style.animationDelay=((k++)*7)+'ms';
  });
  boardEl.replaceChildren(frag);
  updateHud();
}

function setMsg(html){
  msgEl.innerHTML='';
  const s=document.createElement('span');
  s.className='msg-in';
  s.innerHTML=html;
  msgEl.appendChild(s);
}

function updateHud(){
  let w=0,bk=0;
  for(const p of state.board){ if(p>0) w++; else if(p<0) bk++; }
  countsEl.textContent = 'blancs '+w+' · noirs '+bk;

  statusEl.classList.toggle('win', !!state.over);
  turnDot.classList.toggle('ai', state.aiThinking || state.turn===-1);
  let msg;
  if(state.over){
    if(state.draw) msg='Partie nulle (60 coups sans prise).';
    else msg = state.turn===1 ? 'Les noirs gagnent.' : 'Les blancs gagnent.';
    showOverlay();
  }else if(state.aiThinking) msg='<b>L\'IA réfléchit<span class="dots"><span>.</span><span>.</span><span>.</span></span></b>';
  else if(state.pending.length) msg='<b>Prise multiple</b> — continuez la rafle.';
  else if(state.turn===1) msg='À vous de jouer.';
  else msg='Au tour des noirs.';
  setMsg(msg);

  undoEl.disabled = state.aiThinking || state.animating || state.history.length===0;
}

/* ---------- Fin de partie ---------- */
function showOverlay(){
  if(overlayEl.classList.contains('show')) return; // une seule fois par partie
  const plies=state.history.length;
  if(state.draw){
    trophyEl.textContent='🤝';
    endTitleEl.textContent='Match nul';
    endSubEl.textContent=plies+' coups joués — 60 coups sans prise.';
  }else if(state.turn===1){
    trophyEl.textContent='😞';
    endTitleEl.textContent='Les noirs gagnent';
    endSubEl.textContent=plies+' coups joués. Revanche ?';
    sfx.lose();
  }else{
    trophyEl.textContent='🏆';
    endTitleEl.textContent='Victoire !';
    endSubEl.textContent=plies+' coups joués. Superbe partie.';
    sfx.win();
    confetti();
  }
  overlayEl.classList.add('show');
}
function hideOverlay(){ overlayEl.classList.remove('show'); }
function confetti(){
  if(reducedMotion) return;
  const colors=['#f2c14e','#58a6ff','#3fb950','#ff7b72','#bc8cff','#fff'];
  for(let i=0;i<90;i++){
    const c=document.createElement('div');
    c.className='confetti';
    const sz=5+Math.random()*7;
    c.style.left=(Math.random()*100)+'vw';
    c.style.width=sz+'px'; c.style.height=(sz*0.5+3)+'px';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2.4+Math.random()*2.2)+'s';
    c.style.animationDelay=(Math.random()*0.9)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5500);
  }
}

undoEl.addEventListener('click',undo);
resetEl.addEventListener('click',reset);
againEl.addEventListener('click',()=>{ hideOverlay(); reset(); });
reset();
</script>
