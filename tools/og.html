<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(900px 480px at 84% 4%,rgba(76,194,255,.14),transparent 60%),radial-gradient(700px 380px at 0% 100%,rgba(217,168,63,.12),transparent 60%),linear-gradient(135deg,#0b1f3a 0%,#0a1b32 60%,#071427 100%);color:#fff;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;align-items:center;gap:54px;padding:54px 70px}
.grid{position:absolute;inset:0;opacity:.15;background-image:linear-gradient(to right,rgba(138,182,232,.28) 1px,transparent 1px),linear-gradient(to bottom,rgba(138,182,232,.28) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(70% 70% at 50% 40%,#000 20%,transparent 78%);mask-image:radial-gradient(70% 70% at 50% 40%,#000 20%,transparent 78%)}
.card{position:relative;z-index:1;width:470px;height:522px;border-radius:26px;background:#000;border:1px solid rgba(217,168,63,.28);box-shadow:0 30px 70px rgba(0,0,0,.55);display:grid;place-items:center;overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain;display:block}
.txt{position:relative;z-index:1;max-width:600px}
.eyebrow{font-size:20px;letter-spacing:.26em;text-transform:uppercase;color:#d9a83f;margin:0 0 20px;font-weight:700}
p.sub{margin:0;font-size:30px;color:#d7e6f7;line-height:1.4;font-weight:600}
p.line{margin:22px 0 0;font-size:24px;color:#b9cbe2;line-height:1.5}
.url{margin:30px 0 0;font-size:22px;color:#7f9bbd;letter-spacing:.04em}
</style></head><body>
<div class="grid"></div>
<div class="card"><img src="http://10.10.10.108/assets/logo-original.png" alt="Marexsoft Corp"></div>
<div class="txt">
  <p class="eyebrow">Services IT &amp; web</p>
  <p class="sub">Des solutions numériques solides,<br>pensées pour durer.</p>
  <p class="line">Développement · Infrastructures · Cloud · Cybersécurité</p>
  <p class="url">www.neva-ci.pro</p>
</div>
</body></html>
